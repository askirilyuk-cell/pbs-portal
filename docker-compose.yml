# ============================================================================
#  Портал ИСМ ПБС — производственный модуль (MVP-1)
#  self-hosted на Synology DS725+ · Container Manager · PostgreSQL
#
#  Сервисы: PostgreSQL + NocoDB + n8n + Gotenberg + Metabase
#  Прокси Caddy/HTTPS добавляется отдельным шагом (Фаза A плана развёртывания).
#
#  Развёртывание: см. README.md → «Развёртывание на NAS».
# ============================================================================

services:

  # --------------------------------------------------------------------------
  #  PostgreSQL — единое мастер-хранилище (БД: nocodb, n8n, metabase)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pbs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # доп. БД, создаются init-скриптом ниже
      N8N_DB: ${N8N_DB}
      METABASE_DB: ${METABASE_DB}
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    networks: [pbs]

  # --------------------------------------------------------------------------
  #  NocoDB — база-источник истины + русский UI + формы для планшета + API
  # --------------------------------------------------------------------------
  nocodb:
    image: nocodb/nocodb:latest
    container_name: pbs-nocodb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NC_DB: "pg://postgres:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=${POSTGRES_DB}"
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
      NC_PUBLIC_URL: ${NC_PUBLIC_URL}
      NC_DISABLE_TELE: "true"
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/nocodb:/usr/app/data
    ports:
      - "${NOCODB_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    networks: [pbs]

  # --------------------------------------------------------------------------
  #  n8n — автоматизации: автонумерация ПЗ, агрегация статусов, печать
  # --------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: pbs-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      WEBHOOK_URL: "${N8N_PROTOCOL}://${N8N_HOST}:${N8N_PORT}/"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      # внутренние адреса для нод (NocoDB API, Gotenberg)
      NOCODB_INTERNAL_URL: ${NOCODB_INTERNAL_URL}
      GOTENBERG_INTERNAL_URL: ${GOTENBERG_INTERNAL_URL}
      # секреты/идентификаторы для workflow (заполнить ПОСЛЕ создания базы и токена)
      NC_TOKEN: ${NC_TOKEN:-}
      NC_BASE_ID: ${NC_BASE_ID:-}
    volumes:
      - ${DATA_ROOT}/n8n:/home/node/.n8n
    ports:
      - "${N8N_PORT}:5678"
    mem_limit: 768m
    networks: [pbs]

  # --------------------------------------------------------------------------
  #  Gotenberg — HTML → PDF (печать ПЗ, позже МК/карты задачи/акты)
  # --------------------------------------------------------------------------
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: pbs-gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=false"
      - "--api-timeout=60s"
    ports:
      - "${GOTENBERG_PORT}:3000"
    mem_limit: 512m
    networks: [pbs]

  # --------------------------------------------------------------------------
  #  Metabase — управленческая аналитика (читает БД NocoDB напрямую)
  # --------------------------------------------------------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: pbs-metabase
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB}
      MB_DB_PORT: "5432"
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      MB_JETTY_PORT: "3000"
      JAVA_TOOL_OPTIONS: "-Xmx1g"
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/metabase:/metabase-data
    ports:
      - "${METABASE_PORT}:3000"
    mem_limit: 1500m
    networks: [pbs]

networks:
  pbs:
    name: pbs
    driver: bridge
